
name: Build ART AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d project

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin JVM targets
        working-directory: project
        run: |
          cat > jvm17.gradle <<'EOF'
          allprojects {
              tasks.withType(
                  org.gradle.api.tasks.compile.JavaCompile
              ).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.configureEach {
                  if (it.class.name.contains("KotlinCompile")) {
                      it.kotlinOptions.jvmTarget = "17"
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: project
        run: gradle -I jvm17.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ART-AI-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
