
name: Build ART AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q ART_AI_Project_clean.zip -d project

          echo "Checking Java and Kotlin settings:"
          grep -n -A5 'compileOptions' project/app/build.gradle.kts
          grep -n -A2 'kotlinOptions' project/app/build.gradle.kts

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ART-AI-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
